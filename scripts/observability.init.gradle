// 所有入口共用运行前校验；只配置服务 bootRun，不给 Gradle、编译器或测试 JVM 挂 agent。
import groovy.json.JsonSlurper

def observedService = System.getenv('FLEET_OBSERVABILITY_SERVICE')
def workspaceRoot = initscript.sourceFile.parentFile.parentFile.canonicalFile
def services = new JsonSlurper().parse(new File(workspaceRoot, 'repos.json')).repositories
        .findAll { it.kind == 'java-service' }*.name.toSet()
def managedProperty = { raw ->
    def normalized = raw.toLowerCase(Locale.ROOT).replaceAll('[^a-z0-9]', '')
    ['otel', 'management', 'securityactuator', 'logging', 'github', 'appenv', 'springapplicationversion',
     'springapplicationname', 'springapplicationjson', 'springconfig', 'springprofiles'].any { normalized.startsWith(it) }
}
gradle.beforeProject { project ->
    if (services.contains(project.name) && (!observedService || project.name == observedService)) {
        project.tasks.withType(JavaExec).configureEach { task ->
            if (task.name == 'bootRun') {
                // 每次执行都校验官方 agent 与扩展的 SHA/版本；导入模型和编译不读取秘密。
                task.doFirst {
                    // Gradle 8.14 的 allJvmArgs 在 doFirst 尚未合并 jvmArguments/providers。
                    def configuredJvm = task.allJvmArgs + (task.jvmArgs ?: []) + task.jvmArguments.getOrElse([])
                    configuredJvm += task.jvmArgumentProviders.collectMany { it.asArguments().toList() }
                    def configuredArgs = task.args + task.argumentProviders.collectMany { it.asArguments().toList() }
                    if (configuredJvm.any { argument ->
                        argument.startsWith('-javaagent:') ||
                                (argument.startsWith('-D') && managedProperty(argument.substring(2).split('=', 2)[0]))
                    } || task.systemProperties.keySet().any { managedProperty(it) }
                            || configuredArgs.any { argument -> argument.startsWith('--') && managedProperty(argument.substring(2).split('=', 2)[0]) }) {
                        throw new GradleException('既有 JVM/业务参数覆盖受控观测配置；保留用户设置并拒绝启动，私有值省略。')
                    }
                    def command = ['python3', new File(workspaceRoot, 'scripts/prepare-observed.py').path,
                                   'prepare', project.name, '--version', project.version.toString()]
                    def process = new ProcessBuilder(command).directory(workspaceRoot).start()
                    def output = process.inputStream.getText('UTF-8')
                    process.errorStream.close()
                    if (process.waitFor() != 0) {
                        throw new GradleException('观测启动前校验失败；先配置受限 launch binding，私有值省略。')
                    }
                    def receipt = new JsonSlurper().parseText(output)
                    // 秘密仅在 0600 properties 内。旧 shell 的环境不得覆盖这次私有配置。
                    task.environment.keySet().findAll { key ->
                        managedProperty(key) || key in ['JAVA_TOOL_OPTIONS', 'JDK_JAVA_OPTIONS', '_JAVA_OPTIONS']
                    }.each { task.environment.remove(it) }
                    task.jvmArgs(receipt.jvm_arguments)
                }
            }
        }
    }
}
