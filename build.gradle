plugins {
    id 'base'
    id 'idea'
}

def javaRepositories = gradle.ext.workspaceJavaRepositories

// IDEA 原生 Application 的 Before Run 使用此入口；仅准备配置，不启动或终止 JVM。
javaRepositories.findAll { it.kind == 'java-service' }.each { repo ->
    def suffix = repo.name.split('-').collect { it.capitalize() }.join('')
    tasks.register("prepareObserved${suffix}", Exec) {
        group = 'application'
        description = "校验 ${repo.name} 观测制品并刷新本机私有配置。"
        workingDir(rootDir)
        commandLine('python3', new File(rootDir, 'scripts/prepare-observed.py').path, 'prepare', repo.name, '--check-idea')
    }
}

// 保留曾经复用的移动端目录，但不将其加入根模块的 IDEA 内容模型。
def excludedMobile = file('ai-wechat-mini-programs')
def activeRoots = gradle.ext.workspaceRepositories.collect { file(it.name).canonicalFile }.toSet()
activeRoots.add(projectDir.canonicalFile)
if (!activeRoots.contains(excludedMobile.canonicalFile)) {
    idea.module.excludeDirs += [excludedMobile, excludedMobile.canonicalFile]
}

tasks.register('verifyWorkspace') {
    group = 'verification'
    description = '核对清单的 11 个 Java included builds；不启动服务、不发布制品。'
    doLast {
        def expected = javaRepositories*.name.toSet()
        def actual = gradle.includedBuilds*.name.toSet()
        if (actual != expected) {
            throw new GradleException("Java 构建与清单不一致：expected=${expected}, actual=${actual}")
        }
        logger.lifecycle("Verified ${actual.size()} Java included builds: ${javaRepositories*.name.join(', ')}")
        logger.lifecycle('SDK substitution: com:utils -> :utils, com:rpc-api -> :rpc-api (workspace only)')
    }
}

tasks.register('compileAllJava') {
    group = 'build'
    description = '编译清单内全部 11 个 Java 构建的生产源码，不执行测试、服务或发布。'
    dependsOn tasks.named('verifyWorkspace')
    dependsOn javaRepositories.collect { gradle.includedBuild(it.name).task(':compileJava') }
}
